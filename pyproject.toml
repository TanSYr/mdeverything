[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdeverything"
version = "0.2.0"
description = "Turn videos into portable, timestamped Markdown. Local-first, captions-first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "TanSYr"}]
keywords = ["markdown", "video", "transcription", "whisper", "yt-dlp", "obsidian"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Video"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "yt-dlp[default]>=2026.1", "httpx[socks]>=0.27,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
mdeverything = "mdeverything.cli:main"
mde = "mdeverything.cli:main"

[project.urls]
Homepage = "https://github.com/TanSYr/mdeverything"
Issues = "https://github.com/TanSYr/mdeverything/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mdeverything"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["desktop/node_modules", "desktop/.build", "desktop/engine", "desktop/runtime", "desktop/release"]
