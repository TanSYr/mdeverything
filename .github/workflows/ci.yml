name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m mdeverything convert examples/demo.vtt -o smoke-output
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mde-smoke .
      - run: docker run --rm mde-smoke mde doctor
      - name: Container API smoke test
        run: |
          docker run -d --name mde-smoke -p 127.0.0.1:8765:8765 mde-smoke
          for i in $(seq 1 30); do
            curl --fail -s http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          job=$(curl --fail -s -X POST -H 'X-MDE-Client: web' http://127.0.0.1:8765/api/demo | jq -r .id)
          sleep 3
          curl --fail -s "http://127.0.0.1:8765/api/jobs/$job/document" | jq -e '.document.segments | length == 8'
      - if: always()
        run: docker logs mde-smoke || true
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real browser smoke test
        run: |
          mde serve --data-dir /tmp/mde-ui > /tmp/mde-ui.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail -s http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          python tests/browser_smoke.py
          python tests/browser_models.py
          python tests/browser_preferences.py
      - if: failure()
        run: cat /tmp/mde-ui.log || true
